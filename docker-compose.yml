services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reforco-escolar-app
    restart: unless-stopped
    working_dir: /app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/database/database.sqlite
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - SCHOOL_ADDRESS=${SCHOOL_ADDRESS}
      - SCHOOL_WHATSAPP=${SCHOOL_WHATSAPP}
      - SCHOOL_EMAIL=${SCHOOL_EMAIL}
      - SCHOOL_MAPS_URL=${SCHOOL_MAPS_URL}
    volumes:
      - ./vendor:/app/vendor
      - ./node_modules:/app/node_modules
      - ./app:/app/app:delegated
      - ./database:/app/database:delegated
      - ./routes:/app/routes:delegated
      - ./resources:/app/resources:delegated
      - ./config:/app/config:delegated
      - ./public:/app/public:delegated
      - ./docker:/app/docker:delegated
      - ./.env:/app/.env:delegated
    depends_on:
      - redis
    networks:
      - reforco-network
    labels:
      - com.example.description="Reforço Escolar App"

  nginx:
    image: nginx:latest
    container_name: reforco-escolar-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./vendor:/app/vendor
      - ./public:/app/public
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - reforco-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: reforco-escolar-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - reforco-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Optional: Mailhog for local email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: reforco-escolar-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - reforco-network

volumes:
  redis_data:
    driver: local
  app_vendor:
    driver: local
  app_node_modules:
    driver: local

networks:
  reforco-network:
    driver: bridge
